name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sailswithme
          POSTGRES_PASSWORD: sailswithme
          POSTGRES_DB: sailswithme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sailswithme -d sailswithme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Migrate & test
        env:
          DATABASE_URL: postgis://sailswithme:sailswithme@localhost:5432/sailswithme
          SECRET_KEY: ci-secret
        run: |
          python manage.py migrate --noinput
          pytest
