{% extends "base.html" %}
{% load i18n %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">{% trans "Laisser un avis" %}</h1>
<form method="post" class="max-w-lg rounded-xl border bg-white p-6 space-y-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="rounded bg-sky-600 px-4 py-2 text-white">{% trans "Publier" %}</button>
</form>
{% endblock %}
