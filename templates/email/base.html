{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ site_name|default:"Sail with Me" }}</title>
</head>
<body style="margin:0;padding:0;background-color:#fffbeb;font-family:'Nunito',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#082f49;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#fffbeb;">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:600px;">
          <tr>
            <td style="background-color:#0d9488;border-radius:16px 16px 0 0;padding:20px 24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td width="56" valign="middle" style="padding-right:12px;">
                    <img src="cid:logo" alt="" width="48" height="48" style="display:block;border:0;border-radius:50%;">
                  </td>
                  <td valign="middle" style="font-family:'Fredoka',system-ui,Arial,sans-serif;font-size:22px;font-weight:600;color:#ffffff;line-height:1.2;">
                    {{ site_name|default:"Sail with Me" }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;padding:28px 24px;border-left:1px solid #ccfbf1;border-right:1px solid #ccfbf1;font-size:15px;line-height:1.6;color:#082f49;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="background-color:#082f49;border-radius:0 0 16px 16px;padding:24px;text-align:center;">
              <p style="margin:0 0 8px;font-family:'Fredoka',system-ui,Arial,sans-serif;font-size:16px;font-weight:600;color:#ffffff;">
                {{ site_name|default:"Sail with Me" }}
              </p>
              <p style="margin:0 0 16px;font-size:13px;line-height:1.5;color:#99f6e4;">
                {% trans "Find your crew. Cross the ocean." %}
              </p>
              <p style="margin:0;font-size:11px;color:#5eead4;opacity:0.8;">SAS CLOUDY · AGPL</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
