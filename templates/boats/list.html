{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">{% trans "Mes bateaux" %}</h1>
  <a href="{% url 'boats:create' %}" class="rounded bg-sky-600 px-4 py-2 text-white text-sm">{% trans "Ajouter" %}</a>
</div>
<ul class="space-y-2">
  {% for boat in object_list %}
    <li><a href="{% url 'boats:detail' boat.pk %}" class="text-sky-700 font-medium">{{ boat.name }}</a> — {{ boat.get_boat_type_display }}</li>
  {% empty %}
    <li>{% trans "Aucun bateau." %}</li>
  {% endfor %}
</ul>
{% endblock %}
