{% load i18n %}
<form
  hx-post="{% url 'boats:add_photo' boat.pk %}"
  hx-target="#gallery"
  hx-swap="beforeend"
  hx-encoding="multipart/form-data"
  enctype="multipart/form-data"
  class="flex flex-wrap items-end gap-3 p-4"
>
  {% csrf_token %}
  <div class="flex flex-1 flex-wrap gap-3">{% include "includes/form_fields.html" %}</div>
  <button type="submit" class="btn-primary text-sm">{% trans "Add photo" %}</button>
</form>
