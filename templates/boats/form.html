{% extends "base.html" %}
{% load i18n %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">{% if boat %}{% trans "Modifier" %}{% else %}{% trans "Nouveau bateau" %}{% endif %}</h1>
<form method="post" class="max-w-xl space-y-4 rounded-xl border bg-white p-6">
  {% csrf_token %}
  <div class="space-y-4">{% include "includes/form_fields.html" %}</div>
  <button type="submit" class="rounded bg-sky-600 px-4 py-2 text-white">{% trans "Enregistrer" %}</button>
</form>
{% endblock %}
