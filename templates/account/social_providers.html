{% load i18n socialaccount %}
{% get_providers as socialaccount_providers %}
{% if socialaccount_providers %}
  <div class="space-y-3{% if show_divider %} mt-6{% endif %}">
    {% for provider in socialaccount_providers %}
      <form method="post" action="{% provider_login_url provider.id process=process %}">
        {% csrf_token %}
        <button
          type="submit"
          class="flex w-full cursor-pointer items-center justify-center gap-3 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-800 hover:bg-slate-50"
        >
          {% if provider.id == "google" %}
            <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true">
              <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.44a5.51 5.51 0 0 1-2.39 3.61v3h3.86c2.26-2.08 3.58-5.15 3.58-8.64z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.86-3c-1.07.72-2.45 1.16-4.09 1.16-3.14 0-5.8-2.12-6.75-4.97H1.26v3.09A12 12 0 0 0 12 24z"/>
              <path fill="#FBBC05" d="M5.25 14.28A7.2 7.2 0 0 1 4.87 12c0-.79.14-1.56.38-2.28V6.63H1.26A12 12 0 0 0 0 12c0 1.94.46 3.77 1.26 5.37l3.99-3.09z"/>
              <path fill="#EA4335" d="M12 4.75c1.76 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.26 6.63l3.99 3.09C6.2 6.87 8.86 4.75 12 4.75z"/>
            </svg>
            {% trans "Continue with Google" %}
          {% elif provider.id == "facebook" %}
            <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true">
              <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.96.93-1.96 1.89v2.27h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07z"/>
            </svg>
            {% trans "Continue with Facebook" %}
          {% else %}
            {% blocktrans with name=provider.name %}Continue with {{ name }}{% endblocktrans %}
          {% endif %}
        </button>
      </form>
    {% endfor %}
  </div>
  {% if show_divider %}
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center" aria-hidden="true">
        <div class="w-full border-t border-slate-200"></div>
      </div>
      <p class="relative mx-auto w-fit bg-white px-3 text-xs font-semibold uppercase tracking-wide text-slate-400">{% trans "or" %}</p>
    </div>
  {% endif %}
{% endif %}
