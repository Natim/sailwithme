services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sailswithme
      POSTGRES_PASSWORD: sailswithme
      POSTGRES_DB: sailswithme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailswithme -d sailswithme"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgis://sailswithme:sailswithme@db:5432/sailswithme
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
